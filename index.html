<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DeepSeek">
<title>DeepSeek</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar" aria-hidden="true">
    <div class="side-search">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="searchInput" type="search" placeholder="搜索对话内容..." autocomplete="off">
    </div>
    <div class="conv-scroll" id="convScroll"></div>
    <div class="side-foot">
      <button class="side-btn" id="btnSettings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
        </svg>
        设置
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="round-btn" id="btnMenu" aria-label="对话列表">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"></path>
        </svg>
      </button>
      <div class="top-title" id="topTitle">新对话</div>
      <button class="round-btn" id="btnSettingsTop" aria-label="设置">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
        </svg>
      </button>
      <button class="round-btn" id="btnNew" aria-label="新对话">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
      </button>
    </header>

    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <svg class="whale" viewBox="0 0 96 96" width="76" height="76" aria-hidden="true">
          <path fill="#4D6BFE" d="M18 56c0-17 14-29 31-29 15 0 25 9 25 22 0 13-11 22-26 22-18 0-30-5-30-15z"/>
          <path fill="#4D6BFE" d="M68 33c5-6 10-8 15-9-2 6-5 10-9 13-2 1-5-1-6-4z"/>
          <circle cx="57" cy="44" r="4" fill="#fff"/>
          <circle cx="58" cy="44" r="1.5" fill="#1b1b1b"/>
          <path fill="#fff" d="M62 60c4 2 9 3 14 2-4 5-11 7-16 5 0-3 1-5 2-7z"/>
        </svg>
        <h1>你好，我能帮什么忙吗？</h1>
      </div>

      <div class="messages" id="messages"></div>

      <button class="scroll-bottom" id="btnScrollBottom" aria-label="回到底部" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 9l6 6 6-6"></path>
        </svg>
      </button>
    </section>

    <footer class="composer-wrap">
      <div class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="发消息或按住说话" autocomplete="off"></textarea>
        <div class="composer-tools">
          <button class="pill" id="btnThink" type="button">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="3.2"></circle>
              <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"></path>
            </svg>
            深度思考
          </button>
          <button class="pill" id="btnSearch" type="button">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"></path>
            </svg>
            智能搜索
          </button>
          <span class="flex-1"></span>
          <button class="circle-btn" id="btnAttach" type="button" aria-label="添加图片">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
          </button>
          <button class="send-btn" id="btnSend" type="button" aria-label="发送">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7"></path>
            </svg>
          </button>
          <button class="send-btn stop" id="btnStop" type="button" aria-label="停止" hidden>
            <span class="stop-square"></span>
          </button>
        </div>
      </div>
    </footer>
  </main>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-panel" id="sheetPanel"></div>
  </div>

  <div class="modal" id="settingsModal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2>设置</h2>
        <button class="icon-btn" id="btnCloseSettings" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>API Key</span>
          <input id="setKey" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
        </label>
        <p class="hint">在 platform.deepseek.com 创建。只保存在这台设备的浏览器里，不会上传到任何第三方。</p>

        <label class="field">
          <span>接口地址</span>
          <input id="setBase" type="url" placeholder="https://api.deepseek.com" autocomplete="off" spellcheck="false">
        </label>

        <label class="field">
          <span>模型</span>
          <input id="setModel" list="modelList" autocomplete="off" spellcheck="false">
          <datalist id="modelList">
            <option value="deepseek-flash"></option>
            <option value="deepseek-v4-pro"></option>
          </datalist>
        </label>

        <label class="field">
          <span>温度 <b id="tempValue">1.0</b></span>
          <input id="setTemp" type="range" min="0" max="2" step="0.1" value="1">
        </label>
        <p class="hint">越高回答越发散，越低越确定。深度思考模式下该参数不生效。</p>

        <label class="field">
          <span>系统提示词（可选）</span>
          <textarea id="setSystem" rows="3" placeholder="例如：回答尽量简洁"></textarea>
        </label>

        <label class="field">
          <span>主题</span>
          <select id="setTheme">
            <option value="auto">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>

        <div class="group">
          <div class="group-title">数据</div>
          <div class="group-row">
            <button class="ghost-btn" id="btnExport">导出全部</button>
            <button class="ghost-btn" id="btnImport">导入官方归档</button>
          </div>
          <button class="ghost-btn danger block" id="btnClear">清空全部对话</button>
          <p class="hint">导出为官方 <code>export_format_version: 3</code> 的 ZIP，可直接导入 DeepSeek 官方客户端。导入支持官方导出的 ZIP。</p>
        </div>

        <div class="group">
          <div class="group-title">安装到主屏幕</div>
          <p class="hint">Safari 打开本页 → 分享 → 添加到主屏幕。安装后数据不会被系统定期清理，界面也没有地址栏。</p>
        </div>
      </div>
      <div class="modal-foot">
        <button class="primary-btn" id="btnSaveSettings">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <input type="file" id="imageInput" accept="image/*" hidden>
  <input type="file" id="archiveInput" accept=".zip,application/zip" hidden>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
